components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        course:
          type: string
          format: uri
          readOnly: true
        title:
          type: string
          maxLength: 150
        content:
          type: string
          maxLength: 1000
        time:
          type: string
          format: date-time
          readOnly: true
        attachment:
          type: string
          format: uri
          nullable: true
        comments:
          type: string
          format: uri
          readOnly: true
      required:
      - comments
      - content
      - course
      - id
      - time
      - url
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        author:
          type: string
          format: uri
          readOnly: true
        announcement:
          type: string
          format: uri
          readOnly: true
        content:
          type: string
          maxLength: 500
        time:
          type: string
          format: date-time
          readOnly: true
      required:
      - announcement
      - author
      - id
      - time
      - url
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        tutor:
          type: string
          format: uri
          readOnly: true
        title:
          type: string
          maxLength: 150
        announcements:
          type: string
          format: uri
          readOnly: true
        students:
          type: string
          format: uri
          readOnly: true
      required:
      - announcements
      - id
      - students
      - tutor
      - url
    Enrollment:
      type: object
      properties:
        course:
          type: string
          format: uri
          readOnly: true
        student:
          type: string
          format: uri
          readOnly: true
        member_since:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - member_since
      - student
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        tutor:
          type: string
          format: uri
          readOnly: true
        title:
          type: string
          maxLength: 150
        announcements:
          type: string
          format: uri
          readOnly: true
        students:
          type: string
          format: uri
          readOnly: true
    PatchedUser:
      type: object
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
    SendEmailReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    SetPassword:
      type: object
      properties:
        new_password:
          type: string
        current_password:
          type: string
      required:
      - current_password
      - new_password
    SetUsername:
      type: object
      properties:
        current_password:
          type: string
        new_username:
          type: string
          title: Username
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
      required:
      - current_password
      - new_username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
